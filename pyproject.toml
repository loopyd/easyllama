[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyllama"
version = "0.4.0"
description = "Mode-aware local llama.cpp and vLLM runner behind llama-swap"
requires-python = ">=3.11"
dependencies = [
    "colorama",
    "docker",
    "fastapi",
    "huggingface_hub",
    "jinja2",
    "protobuf",
    "pycurl",
    "pyyaml",
    "sentencepiece",
    "torch",
    "tqdm",
    "transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
easyllama = "easyllama.main:main"

[tool.setuptools.packages.find]
include = ["easyllama", "easyllama.*"]

[tool.easyllama.defaults]
image_name_base = "easyllama-local"
image_tag_base = "cuda13"
container_name = "easyllama-server-swap"
host_port = 8080
container_port = 8080
pids_limit = 256
models_dir = "models"
mmproj_dir = "mmproj"
chat_template_dir = "chat_template"
auth_file = "auth.json"
auth_example_file = "auth.json.example"
llama_cpp_repo = "https://github.com/ggml-org/llama.cpp.git"
llama_cpp_ref = "master"

lucebox_hub_repo = "https://github.com/Luce-Org/lucebox-hub.git"
lucebox_hub_ref = "main"
cuda_default_architectures = "120"
log_level = "debug"

[tool.easyllama.configs]
basic = "config/config.basic.yml"
basic_example = "config/config.basic.yml.example"
turboquant = "config/config.turboquant.yml"
turboquant_example = "config/config.turboquant.yml.example"
spiritbuun = "config/config.spiritbuun.yml"
spiritbuun_example = "config/config.spiritbuun.yml.example"
mtp = "config/config.mtp.yml"
mtp_example = "config/config.mtp.yml.example"
lucebox = "config/config.lucebox.yml"
lucebox_example = "config/config.lucebox.yml.example"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["easyllama"]
extend-exclude = [
	".runtime",
	".venv",
	"chat_template",
	"mmproj",
	"models",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RET", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
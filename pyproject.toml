[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyllama"
version = "0.5.3"
description = "Mode-aware local llama.cpp and vLLM runner behind llama-swap"
requires-python = ">=3.11"
dependencies = [
    "colorama",
    "docker",
    "fastapi",
    "huggingface_hub",
    "jinja2",
    "protobuf",
    "pydantic>=2",
    "pycurl",
    "pyyaml",
    "sentencepiece",
    "torch",
    "tqdm",
    "transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
easyllama = "easyllama.main:main"

[tool.setuptools.packages.find]
include = ["easyllama", "easyllama.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: tests requiring Docker or external services",
    "docker: Docker compiler and runtime orchestration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["easyllama", "tests"]
extend-exclude = [
	".runtime",
	".venv",
	"chat_template",
	"mmproj",
	"cache",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RET", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true